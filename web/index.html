<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101528">
  <meta name="description" content="RK3576、K230 与全志 V821、V861、F101 的中文内核实验站。学习 ARM64、RISC-V、Buildroot 和实时系统。">
  <title>Linux Kernel Lab · 内核学习实验室</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="masthead">
    <div class="mast-inner">
      <a class="brand" href="#/" aria-label="Linux Kernel Lab 首页"><img src="./favicon.svg" width="36" height="36" alt=""><span>Kernel<span class="brand-thin"> Lab</span></span></a>
      <nav class="main-links" aria-label="主导航"><a href="#/">首页</a><a href="#/roadmap">学习路线</a><a href="#/labs">实验手册</a><a href="#/platforms">芯片平台</a></nav>
      <div class="mast-tools">
        <button class="search-trigger" id="search-open" aria-label="搜索文档"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><span>搜索</span><kbd>Ctrl K</kbd></button>
        <button class="menu-button" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">文档目录</button>
      </div>
    </div>
  </header>
  <button class="drawer-backdrop" id="backdrop" aria-label="关闭文档目录" hidden></button>
  <aside class="sidebar" id="sidebar" aria-label="文档目录" inert>
    <div class="sidebar-heading"><strong>文档目录</strong><button class="icon-button" id="close-menu" aria-label="关闭目录">×</button></div>
    <nav id="nav"><span>正在载入目录…</span></nav>
    <button class="progress-summary" id="progress-open"><span>我的学习记录 <strong id="rail-count"></strong></span><span class="progress-track"><span id="rail-fill"></span></span></button>
  </aside>
  <div class="shell">
    <main id="main" tabindex="-1"><div class="loading-screen">正在载入学习文档…</div></main>
    <footer class="footer"><a href="#/" class="footer-brand">Kernel Lab</a><span>Linux 内核与芯片架构学习文档</span><a href="https://github.com/Rongkangqi/linux-kernel-lab" target="_blank" rel="noopener noreferrer">GitHub 仓库</a></footer>
  </div>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <div class="dialog-heading"><h2 id="search-title">搜索学习资料</h2><button class="icon-button" data-close="search-dialog" aria-label="关闭搜索">×</button></div>
    <label class="sr-only" for="search-input">搜索概念、实验或源码符号</label><input id="search-input" type="search" placeholder="搜索 task_struct、内存、DMA…" autocomplete="off">
    <div class="search-results" id="search-results" aria-live="polite"></div><div class="dialog-foot">在本地文档中搜索 <span>Esc 关闭</span></div>
  </dialog>
  <dialog id="progress-dialog" aria-labelledby="progress-title">
    <div class="dialog-heading"><h2 id="progress-title">我的学习记录</h2><button class="icon-button" data-close="progress-dialog" aria-label="关闭学习记录">×</button></div>
    <div class="progress-dialog-body"><p id="progress-message"></p><div id="progress-list"></div><p class="muted small">完成状态仅保存在此浏览器，不会同步到服务器。导出 JSON 可跨设备恢复；实验报告请另行保存在自己的笔记中。</p><div class="dialog-actions"><button class="button primary" id="export-progress">导出进度</button><button class="button" id="import-progress">导入备份</button><input id="progress-file" type="file" accept="application/json,.json" hidden><button class="text-button danger" id="reset-progress">清空记录</button></div></div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p>本站需要启用 JavaScript。你也可以在 <a href="https://github.com/Rongkangqi/linux-kernel-lab/tree/main/docs">GitHub 文档目录</a>阅读全部 Markdown 文档。</p></noscript>
</body>
</html>
