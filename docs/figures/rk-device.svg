<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
<title id="title">一个外设怎样从板级描述走到用户可见的结果？</title><desc id="desc">以开发板上一只接到 I²C 总线的器件为例，从左到右核对每一层的证据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#50617a"/></marker></defs>
<rect width="760" height="330" rx="12" fill="#f9fafc"/>
<g font-family="system-ui, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="43" font-size="26" font-weight="690" fill="#1c293e" text-anchor="start">一个外设怎样从板级描述走到用户可见的结果？</text><text x="28" y="73" font-size="17" font-weight="440" fill="#515e72" text-anchor="start">以开发板上一只接到 I²C 总线的器件为例，从左到右核对每一层的证据。</text>
<rect x="25" y="114" width="209" height="78" rx="9" fill="#edf2ff" stroke="#516cb1"/><text x="129.5" y="151" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">板级设备树</text><text x="129.5" y="175" font-size="16" font-weight="410" fill="#39495d" text-anchor="middle">总线、地址、引脚</text>
<rect x="276" y="114" width="210" height="78" rx="9" fill="#edf7e8" stroke="#497a47"/><text x="381" y="151" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">驱动绑定</text><text x="381" y="175" font-size="16" font-weight="410" fill="#39495d" text-anchor="middle">匹配后执行 probe</text>
<rect x="531" y="114" width="204" height="78" rx="9" fill="#fff4db" stroke="#956a23"/><text x="633" y="151" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">实际传输</text><text x="633" y="175" font-size="16" font-weight="410" fill="#39495d" text-anchor="middle">已知输入和读回值</text>
<path d="M235 154 L274 154" fill="none" stroke="#50617a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M488 154 L529 154" fill="none" stroke="#50617a" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="32" y="232" font-size="17" font-weight="650" fill="#1c293e" text-anchor="start">怎样查</text>
<text x="32" y="267" font-size="18" font-weight="450" fill="#1c293e" text-anchor="start">运行 DT 的节点</text>
<text x="281" y="267" font-size="18" font-weight="450" fill="#1c293e" text-anchor="start">sysfs 的 driver 链接</text>
<text x="530" y="267" font-size="18" font-weight="450" fill="#1c293e" text-anchor="start">板上正常用例的结果</text>
<text x="32" y="306" font-size="16" font-weight="450" fill="#1c293e" text-anchor="start">第一步成立，仍须核对后两步。时钟、复位或供电异常都可能影响实际工作。</text></g>
</svg>
