<rect x="169" y="310" width="194" height="57" rx="9" fill="#edf2ff" stroke="#516cb1"/><text x="266" y="344.5" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">子：P</text>
<rect x="482" y="241" width="222" height="57" rx="9" fill="#edf7e8" stroke="#497a47"/><text x="593" y="275.5" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">原页 A</text>
<rect x="482" y="308" width="222" height="57" rx="9" fill="#fff4db" stroke="#956a23"/><text x="593" y="342.5" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">私有副本 B</text>
