<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 371" width="760" height="371" role="img" aria-labelledby="title desc">
<title id="title">两种架构怎样处理同一次首次写入？</title><desc id="desc">假设用户首次写入可写匿名映射，而该地址尚无可写页表项。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#50617a"/></marker></defs>
<rect width="760" height="371" rx="12" fill="#f9fafc"/>
<g font-family="system-ui, Microsoft YaHei, PingFang SC, sans-serif"><text x="28" y="43" font-size="26" font-weight="690" fill="#1c293e" text-anchor="start">两种架构怎样处理同一次首次写入？</text><text x="28" y="73" font-size="17" font-weight="440" fill="#515e72" text-anchor="start">假设用户首次写入可写匿名映射，而该地址尚无可写页表项。</text>
<rect x="34" y="107" width="319" height="68" rx="9" fill="#edf2ff" stroke="#516cb1"/><text x="193.5" y="139" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">ARM64 · 数据访问异常</text><text x="193.5" y="163" font-size="16" font-weight="410" fill="#39495d" text-anchor="middle">解码 ESR，取故障地址</text>
<rect x="404" y="107" width="320" height="68" rx="9" fill="#edf7e8" stroke="#497a47"/><text x="564" y="139" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">RISC-V · store page fault</text><text x="564" y="163" font-size="16" font-weight="410" fill="#39495d" text-anchor="middle">解码 scause，核对 stval</text>
<path d="M193 176 L193 198 L373 198 L373 218" fill="none" stroke="#50617a" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M565 176 L565 198 L385 198 L385 218" fill="none" stroke="#50617a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="196" y="219" width="369" height="62" rx="9" fill="#fff4db" stroke="#956a23"/><text x="380.5" y="248" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">进入通用内存管理</text><text x="380.5" y="272" font-size="16" font-weight="410" fill="#39495d" text-anchor="middle">合法 VMA → handle_mm_fault</text>
<path d="M380 281 L380 304" fill="none" stroke="#50617a" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="139" y="306" width="480" height="48" rx="9" fill="#edf2ff" stroke="#516cb1"/><text x="379" y="336" font-size="20" font-weight="620" fill="#172538" text-anchor="middle">建立可写映射，成功后返回并重试指令</text></g>
</svg>
